<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#371e13">
  <title>Hộp thư admin</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="js/config.js"></script>
  <script src="js/icon-paths.js"></script>
  <script src="js/theme.js"></script>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="lamp"></div>
    <div class="grain"></div>
    <div class="vignette"></div>
  </div>

  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Chuyển chế độ sáng / tối">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d=""/></svg>
  </button>

  <main class="admin">

    <!-- ===== ĐĂNG NHẬP ===== -->
    <section class="panel" id="loginView">
      <div class="frame" aria-hidden="true"><i>✦</i><i>✦</i><i>✦</i><i>✦</i></div>
      <div class="lock-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons/sprite.svg#tabler-lock"></use></svg></div>
      <h1>Khu vực admin</h1>
      <p class="muted">Nhập mật khẩu để đọc thư mọi người gửi cho bạn.</p>
      <form id="loginForm" novalidate>
        <input class="field" type="password" id="password" placeholder="Mật khẩu admin" autocomplete="current-password" required autofocus>
        <button class="btn btn-primary wide" type="submit" id="loginBtn">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons/sprite.svg#tabler-login"></use></svg> Đăng nhập
        </button>
        <p class="error" id="loginError" role="alert"></p>
      </form>
      <a class="back" href="./"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons/sprite.svg#tabler-arrow-left"></use></svg> Về trang profile</a>
    </section>

    <!-- ===== HỘP THƯ ===== -->
    <section class="panel wide" id="inboxView" hidden>
      <div class="frame" aria-hidden="true"><i>✦</i><i>✦</i><i>✦</i><i>✦</i></div>
      <header class="inbox-head">
        <div>
          <h1>Hộp thư</h1>
          <p class="muted" id="stats">—</p>
        </div>
        <div class="head-actions">
          <button class="btn btn-ghost btn-sm" id="refreshBtn" type="button" title="Tải lại danh sách"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons/sprite.svg#tabler-refresh"></use></svg> Làm mới</button>
          <button class="btn btn-ghost btn-sm" id="logoutBtn" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons/sprite.svg#tabler-logout"></use></svg> Đăng xuất</button>
        </div>
      </header>

      <div class="tabs" role="tablist">
        <button class="tab active" data-filter="all" role="tab">Tất cả <span class="count" id="countAll">0</span></button>
        <button class="tab" data-filter="unread" role="tab">Chưa đọc <span class="count" id="countUnread">0</span></button>
        <button class="tab" data-filter="named" role="tab">Có tên</button>
        <button class="tab" data-filter="anonymous" role="tab">Ẩn danh</button>
      </div>

      <div class="letters" id="letters"></div>
      <p class="empty muted" id="empty" hidden>Chưa có thư nào</p>
      <a class="back" href="./"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons/sprite.svg#tabler-arrow-left"></use></svg> Về trang profile</a>
    </section>

  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="js/admin.js"></script>
</body>
</html>
