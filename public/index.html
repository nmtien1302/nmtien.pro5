<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#371e13">
  <title>Profile</title>
  <meta name="description" content="Trang profile cá nhân">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <!-- Cấu hình + chế độ sáng/tối: nạp sớm để không bị nháy màu -->
  <script src="js/config.js"></script>
  <script src="js/icon-paths.js"></script>
  <script src="js/theme.js"></script>
</head>
<body>
  <!-- Nền: 2 mảng màu + hạt nhám (+ ảnh nền nếu đặt trong config) -->
  <div class="bg" aria-hidden="true">
    <div class="photo"></div>
    <div class="lamp"></div>
    <div class="grain"></div>
    <div class="vignette"></div>
  </div>

  <!-- Nút chuyển sáng / tối -->
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Chuyển chế độ sáng / tối">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d=""/></svg>
  </button>

  <!-- ===== POPUP CHÀO MỪNG ===== -->
  <div id="welcome" class="modal-overlay show" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle">
    <div class="modal-box welcome-box">
      <div class="frame" aria-hidden="true"><i>✦</i><i>✦</i><i>✦</i><i>✦</i></div>
      <div class="welcome-gif-wrap">
        <img id="welcomeGif" class="welcome-gif" alt="Mèo gõ laptop" referrerpolicy="no-referrer">
      </div>
      <h2 id="welcomeTitle"></h2>
      <p id="welcomeGreeting" class="greeting"></p>
      <p id="welcomeWish" class="wish"></p>
      <button id="welcomeOk" class="btn btn-primary btn-ok" type="button">OK</button>
      <small id="welcomeHint" class="hint"></small>
    </div>
  </div>

  <!-- ===== PROFILE ===== -->
  <main class="page">
    <section class="card" id="profileCard">
      <!-- trang trái: profile -->
      <div class="sheet col col-profile">
        <div class="frame" aria-hidden="true"><i>✦</i><i>✦</i><i>✦</i><i>✦</i></div>
        <div class="ribbon" id="ribbon"></div>

        <div class="avatar-wrap">
          <img id="avatar" alt="Avatar">
        </div>

        <h1 class="name">
          <span id="name"></span>
          <span id="verified" class="badge" title="Đã xác minh" aria-label="Đã xác minh">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons/sprite.svg#tabler-check"></use></svg>
          </span>
        </h1>
        <div class="rule" aria-hidden="true">✦</div>
        <p class="bio" id="bio"></p>

        <nav class="socials" id="socials" aria-label="Mạng xã hội"></nav>
      </div>

      <!-- trang phải: nhạc + thư -->
      <div class="sheet col col-music">
        <div class="frame" aria-hidden="true"><i>✦</i><i>✦</i><i>✦</i><i>✦</i></div>
        <!-- Music player -->
        <div class="player" id="player">
          <img class="cover" id="cover" alt="">
          <div class="track">
            <div class="track-title" id="trackTitle">—</div>
            <div class="track-artist" id="trackArtist">—</div>
          </div>
          <div class="controls">
            <button class="icon-btn" id="prevBtn" type="button" title="Bài trước" aria-label="Bài trước">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons/sprite.svg#tabler-player-skip-back"></use></svg>
            </button>
            <button class="icon-btn play" id="playBtn" type="button" title="Phát / Dừng" aria-label="Phát">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path id="playIcon" d=""/></svg>
            </button>
            <button class="icon-btn" id="nextBtn" type="button" title="Bài tiếp" aria-label="Bài tiếp">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons/sprite.svg#tabler-player-skip-forward"></use></svg>
            </button>
          </div>
          <input type="range" class="progress" id="progress" min="0" max="100" value="0" step="0.1" aria-label="Tiến trình bài hát">
          <div class="times">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
          </div>
          <div class="player-extra">
            <button class="text-btn" id="playlistBtn" type="button" aria-expanded="false" aria-controls="playlist">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons/sprite.svg#tabler-headphones"></use></svg>
              Đổi nhạc
              <svg class="icon caret" viewBox="0 0 24 24" aria-hidden="true"><path id="caretIcon" d=""/></svg>
            </button>
            <div class="volume">
              <button class="icon-btn small" id="volumeBtn" type="button" title="Tắt / bật tiếng" aria-label="Âm lượng">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path id="volumeIcon" d=""/></svg>
              </button>
              <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.01" value="0.6" aria-label="Âm lượng">
            </div>
          </div>
        </div>

        <!-- Danh sách nhạc (ẩn/hiện) -->
        <div class="playlist" id="playlist">
          <ul id="playlistItems"></ul>
        </div>

        <button class="btn letter-btn" id="letterBtn" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons/sprite.svg#tabler-mail"></use></svg>
          <span id="letterBtnText">Gửi thư cho admin</span>
        </button>
      </div>
    </section>

    <footer class="footer">
      <span class="handle" id="footerText"></span>
      <span class="views-pill" id="views" hidden></span>
    </footer>
  </main>

  <!-- ===== MODAL GỬI THƯ ===== -->
  <div id="letterModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="letterTitle">
    <div class="modal-box letter-box">
      <div class="frame" aria-hidden="true"><i>✦</i><i>✦</i><i>✦</i><i>✦</i></div>
      <button class="modal-close" id="letterClose" type="button" aria-label="Đóng">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons/sprite.svg#tabler-x"></use></svg>
      </button>
      <h2 id="letterTitle">Thư gửi admin</h2>
      <p class="muted" id="letterDesc"></p>

      <form id="letterForm" novalidate>
        <label class="switch-row">
          <span>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="assets/icons/sprite.svg#tabler-spy"></use></svg>
            Gửi ẩn danh
          </span>
          <span class="switch">
            <input type="checkbox" id="anonymous">
            <span class="slider"></span>
          </span>
        </label>

        <input class="field" id="senderName" type="text" placeholder="Tên của bạn" maxlength="50" autocomplete="nickname">
        <textarea class="field" id="letterMessage" rows="5" placeholder="Viết đôi dòng cho admin…" required></textarea>
        <div class="counter"><span id="charCount">0</span>/<span id="charMax">1000</span></div>

        <div class="actions">
          <button type="button" class="btn btn-ghost" id="letterCancel">Huỷ</button>
          <button type="submit" class="btn btn-primary" id="letterSend">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path id="sendIcon" d=""/></svg>
            <span id="letterSendText">Gửi thư</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <audio id="audio" preload="metadata"></audio>

  <script src="js/main.js"></script>
</body>
</html>
